# Pinned tools. tools/setup.py downloads each one into .cache/ once and
# checks its SHA-256 on every `make setup`. To upgrade: change version, url
# and sha256 together, then run `make release`.

[dsd]
version = "0.12.1"
url = "https://github.com/AetiasHax/ds-decomp/releases/download/v0.12.1/dsd-linux-x86_64"
sha256 = "256edde804dd8e5d7bc4c0e4187f85244ee4cd1f42bb427502e01fda6af43ceb"
type = "binary"

[objdiff-cli]
version = "3.8.2"
url = "https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64"
sha256 = "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718"
type = "binary"

# Metrowerks CodeWarrior for DS compilers, relinked as native Linux ELF
