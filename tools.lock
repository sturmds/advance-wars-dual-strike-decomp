# Pinned tools. tools/setup.py downloads each one into .cache/ once and
# checks its SHA-256 on every `make setup`. To upgrade: change version, url
# and sha256 together, then run `make release`.

[dsd]
version = "0.12.1"
url = "https://github.com/AetiasHax/ds-decomp/releases/download/v0.12.1/dsd-linux-x86_64"
sha256 = "256edde804dd8e5d7bc4c0e4187f85244ee4cd1f42bb427502e01fda6af43ceb"
type = "binary"

[objdiff-cli]
version = "3.8.2"
url = "https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64"
sha256 = "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718"
type = "binary"

# Metrowerks CodeWarrior for DS compilers, relinked as native Linux ELF
# binaries. The files keep their .exe names but need no wine.
[metroskrew]
version = "0.1.3"
url = "https://github.com/mid-kid/metroskrew/releases/download/0.1.3/metroskrew-linux.tar.xz"
sha256 = "2fec5ba308690a25157afc532ed87411a413501d43d85892ae4bfb9eb3975790"
type = "tar.xz"

# Source mutator for near-miss functions (tools/permuter.py, issue 0052).
# No releases, so this pins a commit's source archive. MIT; see
# docs/third-party/decomp-permuter.md.
[decomp-permuter]
version = "059609d4aec73eb0650726772954e1ad575825f8"
url = "https://github.com/simonlindholm/decomp-permuter/archive/059609d4aec73eb0650726772954e1ad575825f8.tar.gz"
sha256 = "2e4e0d991e4258df332c19d8dcf372212fe27f1b18e777d9e1eb25fc2c64a404"
type = "tar.gz"

# Formatter for src/ and include/ (`make format`, checked by `make release`).
# The PyPI wheel holds a static Linux binary at clang_format/data/bin/.
# Apache-2.0 with LLVM exception. Style in .clang-format.
[clang-format]
version = "23.1.1"
url = "https://files.pythonhosted.org/packages/42/ef/3f8e215916e79ecd435b5bc20810443f80fce3fb8bbfe6d2783ceb775c1b/clang_format-23.1.1-py2.py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
sha256 = "64900462c1203cee2fec364536c2dda708baf0619e15b52ceda926648cc82f56"
type = "whl"

# mwccarm 2.0 build 56, older than the 2.0-72 that builds everything else.
# Some MSL files only match with it (config/AWRE/compilers.txt, issue 0061).
# A Windows executable, run under wine by tools/wine_cc.py: metroskrew has no
# native build of it, and wibo 1.2.0 leaves the x87 FPU at Linux precision,
# which changes how mwccarm lowers switches. The archive is the CodeWarrior
# for DS compiler set linked from the DS decomp Discord; only
# mwccarm/1.2/b56/ is unpacked.
[mwccarm-b56]
version = "2.0-56"
url = "https://decomp.aetias.com/files/mwccarm.zip"
sha256 = "6f7b16098d2b1bc9b45b278f6e6e24327c4da9b3ebf7924be1afd4a721d83976"
type = "zip"
subdir = "mwccarm/1.2/b56"
